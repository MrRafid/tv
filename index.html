<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Webview Mixed Content Fix (HTTP to HTTPS) -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <title id="page-title">Smart TV App</title>
    
    <!-- Lightweight CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Config File (Ensure this exists in the same directory) -->
    <script src="config.js"></script>
    
    <style>
        :root { --accent: #fbbf24; --focus: #00ffcc; --bg: #050505; --card: #111827; }
        body { background-color: var(--bg); color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        /* Layouts */
        .sticky-top { position: sticky; top: 0; z-index: 50; background: var(--bg); box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .video-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid var(--accent); }
        .video-box video { width: 100%; height: 100%; object-fit: contain; }
        
        /* UI Elements */
        .cat-btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; text-transform: uppercase; white-space: nowrap; transition: 0.2s; border: 2px solid transparent; background: var(--card); color: #9ca3af; }
        .cat-btn.active { background: var(--accent); color: #000; }
        
        .channel-card { background: var(--card); border: 2px solid transparent; border-radius: 8px; padding: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .channel-card img { width: 40px; height: 40px; object-fit: contain; background: #000; border-radius: 4px; padding: 2px; }
        .channel-card.active { border-color: var(--accent); background: #1f2937; }
        .channel-card.active h3 { color: var(--accent); }
        
        /* 🔴 Smart TV Remote Focus 🔴 */
        .tv-focus { border-color: var(--focus) !important; box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); transform: scale(1.05); background: #1f2937; z-index: 10; }
        
        /* Utilities */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    
    <div class="sticky-top w-full max-w-5xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center px-4 py-2 bg-[#0a0a0a]">
            <div>
                <h1 id="header-title" class="text-lg font-black text-[#fbbf24] uppercase tracking-wide">TV APP</h1>
                <p id="now-playing" class="text-[10px] text-gray-400 uppercase tracking-widest">Select a channel...</p>
            </div>
            <div id="statusBadge" class="hidden px-2 py-0.5 bg-red-600 text-white text-[10px] font-bold rounded animate-pulse">LIVE</div>
        </div>
        
        <!-- Player -->
        <div class="video-box">
            <video id="player" controls playsinline></video>
            <div id="loader" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-black/80 text-[#fbbf24] text-xs font-bold">
                <i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i> BUFFERING...
            </div>
        </div>
        
        <!-- Categories -->
        <div class="px-3 py-2 bg-[#0a0a0a] border-b border-gray-800">
            <div id="categories" class="flex gap-2 overflow-x-auto hide-scroll pb-1"></div>
        </div>
    </div>

    <!-- Channels Grid -->
    <div class="flex-1 w-full max-w-5xl mx-auto p-3 pb-12">
        <div id="loadingMsg" class="text-center py-10 hidden text-gray-500 text-sm font-bold uppercase tracking-widest">
            <i class="fas fa-sync fa-spin mr-2"></i> Loading Data...
        </div>
        <!-- Adaptive Grid: 2 cols on mobile, 3 on tablet, 4 on TV -->
        <div id="channels" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
    </div>

    <script>
        // Fallback config if config.js fails
        const CFG = typeof APP_CONFIG !== 'undefined' ? APP_CONFIG : {
            headerTitle: "SMART TV", developerName: "Dev",
            categories: [{ name: "Live TV", url: "" }]
        };

        const App = {
            data: [], hls: null, focusIdx: { zone: 0, index: 0 }, // zone 0: cat, 1: ch
            colCount: 2, catEls: [], chEls: [],

            init() {
                document.getElementById('header-title').innerText = CFG.headerTitle || 'TV';
                this.els = {
                    vid: document.getElementById('player'),
                    cats: document.getElementById('categories'),
                    grid: document.getElementById('channels'),
                    load: document.getElementById('loadingMsg'),
                    badge: document.getElementById('statusBadge'),
                    loader: document.getElementById('loader'),
                    playing: document.getElementById('now-playing')
                };

                this.calcColumns();
                window.addEventListener('resize', () => { this.calcColumns(); this.updateTVFocus(); });
                
                this.renderCategories();
                this.setupControls();
                
                // Event Delegation for Performance (Better for low RAM TVs)
                this.els.grid.addEventListener('click', (e) => {
                    const card = e.target.closest('.channel-card');
                    if (card) {
                        const idx = parseInt(card.dataset.idx);
                        this.play(this.data[idx], card);
                        this.setFocus(1, idx);
                    }
                });
            },

            calcColumns() {
                const w = window.innerWidth;
                this.colCount = w >= 1024 ? 5 : (w >= 768 ? 4 : (w >= 640 ? 3 : 2));
            },

            renderCategories() {
                this.els.cats.innerHTML = '';
                CFG.categories.forEach((cat, i) => {
                    const btn = document.createElement('button');
                    btn.className = `cat-btn ${i === 0 ? 'active' : ''}`;
                    btn.innerText = cat.name;
                    btn.onclick = () => {
                        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.setFocus(0, i);
                        this.loadData(cat.url);
                    };
                    this.els.cats.appendChild(btn);
                });
                
                this.catEls = Array.from(this.els.cats.children);
                if (CFG.categories.length > 0) this.loadData(CFG.categories[0].url);
            },

            async loadData(url) {
                if(!url) return;
                this.els.grid.innerHTML = '';
                this.els.load.classList.remove('hidden');
                this.data = [];
                
                try {
                    const res = await fetch(url);
                    const txt = await res.text();
                    
                    // Async parsing to prevent UI freeze
                    setTimeout(() => { this.parseM3U(txt); }, 10);
                } catch (e) {
                    this.els.load.innerHTML = `<span class="text-red-500">Connection Failed!</span>`;
                }
            },

            parseM3U(txt) {
                const lines = txt.split('\n');
                let itm = {};
                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        itm.name = line.split(',').pop()?.trim() || "Unknown";
                        itm.logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || "";
                    } else if (line.startsWith('http')) {
                        itm.url = line;
                        this.data.push({ ...itm });
                        itm = {};
                    }
                }
                this.renderChannels();
            },

            renderChannels() {
                let html = '';
                this.data.forEach((ch, i) => {
                    const img = ch.logo || `https://via.placeholder.com/80x80/111827/fbbf24?text=${ch.name.charAt(0)}`;
                    html += `
                        <div class="channel-card" data-idx="${i}">
                            <img src="${img}" loading="lazy" onerror="this.src='https://via.placeholder.com/80x80/111827/fbbf24?text=TV'">
                            <div class="flex-1 overflow-hidden">
                                <h3 class="text-xs font-bold text-gray-200 line-clamp-1">${ch.name}</h3>
                            </div>
                        </div>`;
                });
                this.els.grid.innerHTML = html;
                this.els.load.classList.add('hidden');
                this.chEls = Array.from(this.els.grid.children);
                
                // Reset focus to top of grid when new data loads
                if (this.focusIdx.zone === 1) this.setFocus(1, 0); 
                
                // Autoplay first channel if first load
                if (this.data.length > 0 && !this.els.vid.src && !this.hls) {
                    this.play(this.data[0], this.chEls[0]);
                }
            },

            play(ch, el) {
                document.querySelectorAll('.channel-card.active').forEach(e => e.classList.remove('active'));
                if (el) el.classList.add('active');
                
                this.els.playing.innerText = ch.name;
                this.els.badge.classList.add('hidden');
                this.els.loader.classList.remove('hidden');
                
                if (Hls.isSupported()) {
                    if (this.hls) this.hls.destroy();
                    // TV Optimized HLS Settings (Low RAM usage)
                    this.hls = new Hls({ maxBufferLength: 20, maxMaxBufferLength: 30 });
                    this.hls.loadSource(ch.url);
                    this.hls.attachMedia(this.els.vid);
                    this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        this.els.vid.play().catch(e => console.log("Autoplay blocked"));
                        this.els.badge.classList.remove('hidden');
                        this.els.loader.classList.add('hidden');
                    });
                    this.hls.on(Hls.Events.ERROR, (e, data) => {
                        if (data.fatal) this.els.loader.innerHTML = `<span class="text-red-500">Error playing stream</span>`;
                    });
                } else if (this.els.vid.canPlayType('application/vnd.apple.mpegurl')) {
                    this.els.vid.src = ch.url;
                    this.els.vid.play();
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            // --- 2D Smart TV Navigation Logic ---
            setupControls() {
                document.addEventListener('keydown', (e) => {
                    const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'OK'];
                    if (!keys.includes(e.key)) return;
                    e.preventDefault();

                    let { zone, index } = this.focusIdx;
                    const maxCat = this.catEls.length - 1;
                    const maxCh = this.chEls.length - 1;

                    if (e.key === 'Enter' || e.key === 'OK') {
                        if (zone === 0) this.catEls[index]?.click();
                        else if (zone === 1) this.chEls[index]?.click();
                        return;
                    }

                    if (zone === 0) { // In Categories
                        if (e.key === 'ArrowRight' && index < maxCat) index++;
                        else if (e.key === 'ArrowLeft' && index > 0) index--;
                        else if (e.key === 'ArrowDown' && maxCh >= 0) { zone = 1; index = 0; }
                    } 
                    else if (zone === 1) { // In Channels
                        if (e.key === 'ArrowRight' && index < maxCh) index++;
                        else if (e.key === 'ArrowLeft' && index > 0) index--;
                        else if (e.key === 'ArrowDown' && index + this.colCount <= maxCh) index += this.colCount;
                        else if (e.key === 'ArrowUp') {
                            if (index - this.colCount >= 0) index -= this.colCount;
                            else { zone = 0; index = this.catEls.findIndex(c => c.classList.contains('active')); if(index<0) index=0; }
                        }
                    }

                    this.setFocus(zone, index);
                });
            },

            setFocus(zone, idx) {
                this.focusIdx = { zone, index: idx };
                this.updateTVFocus();
            },

            updateTVFocus() {
                document.querySelectorAll('.tv-focus').forEach(el => el.classList.remove('tv-focus'));
                const activeEl = this.focusIdx.zone === 0 
                    ? this.catEls[this.focusIdx.index] 
                    : this.chEls[this.focusIdx.index];
                
                if (activeEl) {
                    activeEl.classList.add('tv-focus');
                    activeEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
